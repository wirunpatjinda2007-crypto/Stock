<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#101826">
<title>ระบบนับสต๊อก</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101826;--ink2:#1c2738;--sheet:#eef0f3;--line:#dde1e8;--mut:#667085;--sig:#ffc400;--ok:#14924f;--okb:#dcf5e7;--bad:#d9382c;--badb:#fde4e1;--over:#b86e00;--overb:#fff1d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:640px;background:var(--sheet);color:var(--ink);font:15px/1.4 "IBM Plex Sans Thai",-apple-system,"Noto Sans Thai",sans-serif;padding-bottom:120px}
button,input{font:inherit}
button{cursor:pointer;border:0;transition:transform .12s,background .12s}
button:active{transform:scale(.95)}
button:focus-visible,.tab:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
header{background:var(--ink);color:#fff;padding:16px 16px 18px;border-radius:0 0 22px 22px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.sync{width:9px;height:9px;border-radius:50%;background:#4ade80}
.sync.busy{background:var(--sig);animation:p 1s infinite}.sync.off{background:#f87171}
@keyframes p{50%{opacity:.3}}
.badge{padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;background:var(--ink2);color:#cbd5e1;border:1px solid #2c3a4f}
.badge.on{background:var(--sig);color:var(--ink);border-color:var(--sig)}
.prog{height:8px;border-radius:4px;background:var(--ink2);margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sig);border-radius:4px;transition:width .4s}
.pct{font-size:12px;color:#cbd5e1}
.ro{background:var(--overb);color:#7a4a00;font-size:12px;text-align:center;padding:8px 12px;margin:12px 16px 0;border-radius:10px}
.bar{position:sticky;top:0;z-index:15;background:var(--sheet);padding:12px 16px 6px}
.search{position:relative}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.5}
.search input{width:100%;padding:12px 14px 12px 42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:0}
.search input:focus,.fg input:focus{border-color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.tab{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}
.tab em{font-style:normal;margin-left:6px;padding:1px 7px;border-radius:10px;background:var(--sheet);font-size:12px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on em{background:var(--sig);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
.chip{padding:8px 13px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.red{color:var(--bad);background:var(--badb);border-color:#f7c4be}
body:not(.adm) .adm-only:after{content:" 🔒";font-size:11px}
.list{padding:0 16px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px 13px 19px;margin-bottom:10px;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.card.ok:before{background:var(--ok)}.card.short:before{background:var(--bad)}.card.over:before{background:var(--over)}
.nm{font-weight:600;font-size:16px;padding-right:76px}
.sku{display:inline-block;margin-top:4px;font-size:12px;color:var(--mut);background:var(--sheet);padding:2px 8px;border-radius:6px}
.meta{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--mut);font-size:13px}
.meta b{color:var(--ink);font-size:15px}
.pill{padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700}
.pill.ok{background:var(--okb);color:#0b6b38}.pill.short{background:var(--badb);color:#a5281e}.pill.over{background:var(--overb);color:#7a4a00}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{width:46px;height:46px;border-radius:12px;background:var(--ink);color:#fff;font-size:24px;font-weight:600}
.ctl button:active{background:var(--sig);color:var(--ink)}
.ctl input{width:84px;height:46px;text-align:center;border:2px solid var(--line);border-radius:12px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;outline:0;background:#fff}
.ctl input:focus{border-color:var(--ink)}
.mt{padding:10px 12px;border-radius:10px;background:var(--sheet);color:var(--ink);font-size:13px;font-weight:600}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.tools button{width:32px;height:32px;border-radius:9px;background:var(--sheet);color:var(--mut)}
.tools [data-act=del]{background:var(--badb);color:var(--bad)}
.chk{display:none;position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;align-items:center;justify-content:center;color:#fff;font-size:13px}
.sel-mode .chk{display:flex}.sel-mode .tools{display:none}
.sel-mode .ctl,.sel-mode .mt{pointer-events:none;opacity:.4}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.card.sel .chk{background:var(--ink);border-color:var(--ink)}.card.sel .chk:after{content:"✓"}
.sk{height:120px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,#e4e7ec 25%,#f1f3f6 50%,#e4e7ec 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:56px 20px;color:var(--mut)}
.empty .ic{font-size:52px}.empty h3{margin:10px 0 4px;color:var(--ink)}
.btn{padding:12px 18px;border-radius:12px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.4}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--sig);color:var(--ink);font-size:32px;font-weight:500;box-shadow:0 6px 18px rgba(16,24,38,.3);z-index:25}
.selbar{position:fixed;left:50%;bottom:0;width:100%;max-width:640px;transform:translate(-50%,100%);transition:transform .3s;background:#fff;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(16,24,38,.15);display:flex;gap:10px;align-items:center;z-index:30}
.selbar.show{transform:translate(-50%,0)}.selbar span{flex:1;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:rgba(16,24,38,.55);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s}
@keyframes up{from{transform:translateY(100%)}}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:19px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.fg input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;outline:0}
.acts{display:flex;gap:10px;margin-top:16px}.acts .btn{flex:1}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);transition:.15s}
.dots i.f{background:var(--ink);border-color:var(--ink);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{padding:17px;border-radius:14px;background:var(--sheet);font-size:22px;font-weight:600}
.pad button:active{background:var(--sig)}.pad button.a{background:none;font-size:14px;color:var(--mut)}
.err{color:var(--bad);text-align:center;font-size:13px;min-height:18px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>📦 นับสต๊อก <i class="sync busy" id="sync"></i></h1><button class="badge" id="badge" onclick="adminClick()">🔓 โหมดทั่วไป</button></div>
  <div class="prog"><i id="bar"></i></div><div class="pct" id="pct"></div>
</header>
<div class="ro" id="ro">👤 โหมดทั่วไป: นับสต๊อกได้ แต่เพิ่ม แก้ไข หรือลบสินค้าไม่ได้</div>
<div class="bar">
  <div class="search"><i>🔍</i><input id="q" placeholder="ค้นหาชื่อสินค้าหรือ SKU"></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="all">ทั้งหมด<em id="n0">0</em></button>
    <button class="tab" data-t="pending">ยังไม่นับ<em id="n1">0</em></button>
    <button class="tab" data-t="done">นับแล้ว<em id="n2">0</em></button>
    <button class="tab" data-t="diff">ผลต่าง<em id="n3">0</em></button>
  </div>
</div>
<div class="chips">
  <button class="chip" onclick="exportCSV()">📥 ส่งออก CSV</button>
  <button class="chip adm-only" id="selBtn" onclick="toggleSel()">☑️ เลือกลบ</button>
  <button class="chip adm-only" onclick="resetCount()">🔄 รีเซ็ตการนับ</button>
  <button class="chip red adm-only" onclick="clearAll()">🗑️ ลบทั้งหมด</button>
  <button class="chip adm-only" onclick="openPinChange()">🔑 เปลี่ยน PIN</button>
</div>
<div class="list" id="list"></div>
<button class="fab" id="fab" aria-label="เพิ่มสินค้า" onclick="openProd()" hidden>+</button>
<div class="selbar" id="selbar"><span>เลือกแล้ว <b id="selN">0</b> รายการ</span><button class="btn" onclick="toggleSel()">ยกเลิก</button><button class="btn red" id="selDel" onclick="delSel()">🗑️ ลบ</button></div>

<div class="modal" id="mProd"><div class="sheet">
  <h2 id="pTitle">เพิ่มสินค้า</h2>
  <div class="fg"><label>ชื่อสินค้า *</label><input id="fName" placeholder="เช่น น้ำดื่ม 600ml"></div>
  <div class="fg"><label>SKU / รหัสสินค้า</label><input id="fSku" placeholder="เช่น SKU001"></div>
  <div class="fg"><label>จำนวนในระบบ *</label><input id="fSys" type="number" min="0" inputmode="numeric" placeholder="0"></div>
  <div class="acts"><button class="btn" onclick="closeM('mProd')">ยกเลิก</button><button class="btn pri" onclick="saveProd()">บันทึก</button></div>
</div></div>
<div class="modal" id="mPin"><div class="sheet" style="max-width:360px">
  <h2 id="pinT" style="text-align:center">🔐 เข้าสู่โหมดแอดมิน</h2>
  <div style="text-align:center;color:var(--mut);font-size:13px">ใส่รหัส PIN 4 หลัก</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div><div class="err" id="pinErr"></div>
</div></div>
<div class="modal" id="mCh"><div class="sheet" style="max-width:400px">
  <h2>🔑 เปลี่ยน PIN</h2>
  <div class="fg"><label>PIN เดิม</label><input id="oP" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
  <div class="fg"><label>PIN ใหม่ (4 หลัก)</label><input id="nP" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
  <div class="fg"><label>ยืนยัน PIN ใหม่</label><input id="cP" type="password" maxlength="4" inputmode="numeric" placeholder="••••"></div>
  <div class="acts"><button class="btn" onclick="closeM('mCh')">ยกเลิก</button><button class="btn pri" onclick="changePin()">บันทึก</button></div>
</div></div>
<div class="modal" id="mAsk"><div class="sheet" style="max-width:400px">
  <h2 id="aT"></h2><p id="aX" style="color:var(--mut);margin:0 0 4px"></p>
  <div class="acts"><button class="btn" onclick="closeM('mAsk')">ยกเลิก</button><button class="btn red" id="aOk">ยืนยัน</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== ตั้งค่า Supabase (Project Settings > API) =====
const SUPABASE_URL='https://xxxx.supabase.co';
const SUPABASE_KEY='ใส่ anon / publishable key';
const DEFAULT_PIN='1234';

const configured=!SUPABASE_URL.includes('xxxx');
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
let products=[],adminPin=DEFAULT_PIN,isAdmin=false,editingId=null,tab='all',term='',pin='',pinCb=null,selMode=false,sel=new Set(),askFn=null;
let loaded=false,online=true,synced={},localVer=0,saving=0,queue=Promise.resolve(),renderPending=false;

// ===== ตัวช่วย =====
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isCounted=p=>p.counted!==null&&p.counted!==undefined;
const diffOf=p=>isCounted(p)?p.counted-p.system:null;
const byId=id=>products.find(p=>p.id===id);
const buzz=()=>navigator.vibrate&&navigator.vibrate(8);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function setSync(s){$('sync').className='sync '+s}
function openM(id){$(id).classList.add('show')}
function closeM(id){$(id).classList.remove('show')}
function ask(title,text,fn,ok){$('aT').textContent=title;$('aX').textContent=text;$('aOk').textContent=ok||'ยืนยัน';askFn=fn;openM('mAsk')}
$('aOk').onclick=()=>{closeM('mAsk');const f=askFn;askFn=null;f&&f()};
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeM(m.id)}));

// ===== ข้อมูลกลาง (Supabase) =====
const pack=p=>({name:p.name,sku:p.sku||'',system:p.system,counted:p.counted??null});
const sigRows=rows=>JSON.stringify(rows.map(r=>[r.id,r.name,r.sku||'',r.system,r.counted??null]));
function applyRows(rows){synced={};products=rows.map(r=>{const p={id:r.id,name:r.name,sku:r.sku||'',system:r.system,counted:r.counted};synced[p.id]=JSON.stringify(pack(p));return p})}

async function refresh(){
  if(!configured){loaded=true;setSync('off');render();return}
  const v=localVer;
  const [a,b]=await Promise.all([
    sb.from('products').select('*').order('created_at').order('id'),
    sb.from('settings').select('value').eq('key','admin_pin').maybeSingle()
  ]);
  if(a.error){console.error(a.error);online=false;setSync('off');if(!loaded){loaded=true;render()}return}
  online=true;if(b.data)adminPin=b.data.value;
  if(v!==localVer||saving>0)return;               // มีการแก้ไขระหว่างโหลด ข้ามรอบนี้
  setSync('ok');
  if(loaded&&sigRows(a.data)===sigRows(products))return;   // ไม่มีอะไรเปลี่ยน ไม่ต้องวาดใหม่
  applyRows(a.data);loaded=true;safeRender();
}
function saveData(){localVer++;queue=queue.then(doSave)}
async function doSave(){
  saving++;setSync('busy');let ok=true;
  try{
    const rows=products.filter(p=>JSON.stringify(pack(p))!==synced[p.id]).map(p=>({id:p.id,...pack(p)}));
    const gone=Object.keys(synced).filter(id=>!products.some(p=>p.id===id));
    if(rows.length){const{error}=await sb.from('products').upsert(rows);if(error)throw error;rows.forEach(r=>{const{id,...d}=r;synced[id]=JSON.stringify(d)})}
    if(gone.length){const{error}=await sb.from('products').delete().in('id',gone);if(error)throw error;gone.forEach(id=>delete synced[id])}
  }catch(e){console.error(e);ok=false;toast('⚠️ บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต')}
  saving--;setSync(ok?'ok':'off');
}
function savePin(p){adminPin=p;sb&&sb.from('settings').upsert({key:'admin_pin',value:p}).then(r=>r.error&&toast('⚠️ บันทึก PIN ไม่สำเร็จ'))}
// ไม่วาดใหม่ตอนกำลังพิมพ์ตัวเลข (กันช่องที่พิมพ์ค้างถูกล้าง)
function safeRender(){const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.closest('#list')){renderPending=true;return}renderPending=false;render()}

// ===== แอดมิน / PIN =====
function adminUI(){
  document.body.classList.toggle('adm',isAdmin);
  $('badge').className='badge'+(isAdmin?' on':'');
  $('badge').textContent=isAdmin?'🔒 แอดมิน':'🔓 โหมดทั่วไป';
  $('ro').style.display=isAdmin?'none':'block';
  $('fab').hidden=!isAdmin||selMode;
  if(!isAdmin&&selMode)exitSel();
}
function adminClick(){isAdmin?ask('ออกจากโหมดแอดมิน?','ต้องใส่ PIN อีกครั้งจึงจะเพิ่ม แก้ไข หรือลบสินค้าได้',()=>{isAdmin=false;adminUI();render();toast('ออกจากโหมดแอดมินแล้ว')},'ออกจากโหมด'):openPin()}
function needAdmin(fn){isAdmin?fn():openPin(fn)}
function openPin(cb){pin='';pinCb=cb||null;$('pinT').textContent=cb?'🔐 ยืนยันตัวตน':'🔐 เข้าสู่โหมดแอดมิน';$('pinErr').textContent='';dots();openM('mPin')}
function dots(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('f',i<pin.length))}
function pinKey(k){
  if(k==='ยกเลิก')return closeM('mPin');
  if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;
  $('pinErr').textContent='';dots();buzz();
  if(pin.length===4)setTimeout(checkPin,150);
}
function checkPin(){
  if(pin===adminPin){closeM('mPin');const cb=pinCb;pinCb=null;pin='';if(cb)cb();else{isAdmin=true;adminUI();render();toast('✅ เข้าสู่โหมดแอดมินแล้ว')}}
  else{$('pinErr').textContent='❌ PIN ไม่ถูกต้อง';pin='';dots();navigator.vibrate&&navigator.vibrate(200)}
}
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9,'ยกเลิก',0,'⌫'].map(k=>`<button class="${isNaN(k)?'a':''}" data-k="${k}">${k}</button>`).join('');
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pinKey(b.dataset.k)});
document.addEventListener('keydown',e=>{if(!$('mPin').classList.contains('show'))return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('⌫');else if(e.key==='Escape')closeM('mPin')});
function openPinChange(){needAdmin(()=>{['oP','nP','cP'].forEach(i=>$(i).value='');openM('mCh')})}
function changePin(){
  const o=$('oP').value.trim(),n=$('nP').value.trim(),c=$('cP').value.trim();
  if(o!==adminPin)return toast('❌ PIN เดิมไม่ถูกต้อง');
  if(!/^\d{4}$/.test(n))return toast('⚠️ PIN ใหม่ต้องเป็นตัวเลข 4 หลัก');
  if(n!==c)return toast('⚠️ PIN ใหม่และยืนยันไม่ตรงกัน');
  savePin(n);closeM('mCh');toast('✅ เปลี่ยน PIN แล้ว');
}

// ===== แสดงผล =====
function stat(p){const d=diffOf(p);return d===null?['','']:d===0?['ok','<span class="pill ok">✓ ตรง</span>']:d<0?['short',`<span class="pill short">ขาด ${-d}</span>`]:['over',`<span class="pill over">เกิน ${d}</span>`]}
function renderStats(){
  const t=products.length,c=products.filter(isCounted).length,d=products.filter(p=>{const x=diffOf(p);return x!==null&&x!==0}).length;
  [t,t-c,c,d].forEach((n,i)=>$('n'+i).textContent=n);
  const pc=t?Math.round(c/t*100):0;$('bar').style.width=pc+'%';
  $('pct').textContent=t?`นับแล้ว ${c} จาก ${t} รายการ (${pc}%)`:'ยังไม่มีสินค้า';
}
function renderList(){
  const el=$('list');
  if(!loaded){el.innerHTML='<div class="sk"></div>'.repeat(3);return}
  let l=products;
  if(tab==='pending')l=l.filter(p=>!isCounted(p));
  else if(tab==='done')l=l.filter(isCounted);
  else if(tab==='diff')l=l.filter(p=>{const x=diffOf(p);return x!==null&&x!==0});
  if(term){const s=term.toLowerCase();l=l.filter(p=>(p.name||'').toLowerCase().includes(s)||(p.sku||'').toLowerCase().includes(s))}
  if(!l.length){
    el.innerHTML=`<div class="empty"><div class="ic">📦</div><h3>ไม่พบรายการสินค้า</h3><div>${!configured?'ยังไม่ได้ใส่ URL และ KEY ของ Supabase ในโค้ด':!online?'เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ต':isAdmin?'กดปุ่ม + เพื่อเพิ่มสินค้า':'ให้แอดมินเพิ่มสินค้าก่อน'}</div></div>`;
    updSel();return;
  }
  el.innerHTML=l.map(p=>{
    const [c,b]=stat(p);
    return `<div class="card ${c} ${sel.has(p.id)?'sel':''}" data-id="${esc(p.id)}">
      <div class="chk"></div>
      ${isAdmin?'<div class="tools"><button data-act="edit" aria-label="แก้ไข">✎</button><button data-act="del" aria-label="ลบ">✕</button></div>':''}
      <div class="nm">${esc(p.name)}</div>
      ${p.sku?`<span class="sku">${esc(p.sku)}</span>`:''}
      <div class="meta">ในระบบ <b>${p.system}</b>${b}</div>
      <div class="row"><div class="ctl"><button data-act="dec" aria-label="ลด">−</button><input type="number" min="0" inputmode="numeric" placeholder="นับ" value="${isCounted(p)?p.counted:''}"><button data-act="inc" aria-label="เพิ่ม">+</button></div><button class="mt" data-act="match">ตรงกับระบบ</button></div>
    </div>`}).join('');
  updSel();
}
function render(){renderStats();renderList()}
// อัปเดตเฉพาะการ์ดที่นับ ไม่วาดทั้งลิสต์ใหม่ (รายการไม่กระโดดหาย ขณะกดนับต่อเนื่อง)
function paint(id){
  renderStats();
  const p=byId(id),el=$('list').querySelector(`[data-id="${CSS.escape(id)}"]`);if(!p||!el)return;
  const [c,b]=stat(p);
  el.classList.remove('ok','short','over');if(c)el.classList.add(c);
  el.querySelector('.meta').innerHTML=`ในระบบ <b>${p.system}</b>${b}`;
  const i=el.querySelector('input');if(document.activeElement!==i)i.value=isCounted(p)?p.counted:'';
}

// ===== นับสต๊อก (ทุกคนทำได้) =====
function bump(id,d){const p=byId(id);if(!p)return;p.counted=Math.max(0,(p.counted??0)+d);saveData();paint(id)}
function setCount(id,v){const p=byId(id);if(!p)return;const n=parseInt(v);p.counted=(v===''||isNaN(n))?null:Math.max(0,n);saveData();paint(id)}
$('list').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const id=card.dataset.id;
  if(selMode){sel.has(id)?sel.delete(id):sel.add(id);renderList();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='inc'||act==='dec'){buzz();bump(id,act==='inc'?1:-1)}
  else if(act==='match'){const p=byId(id);if(p){buzz();setCount(id,p.system)}}
  else if(act==='edit')openProd(id);
  else if(act==='del')delOne(id);
});
$('list').addEventListener('change',e=>{if(e.target.matches('input'))setCount(e.target.closest('.card').dataset.id,e.target.value)});
$('list').addEventListener('focusin',e=>{if(e.target.matches('input'))e.target.select()});
$('list').addEventListener('focusout',()=>{if(renderPending)setTimeout(safeRender,0)});
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));tab=t.dataset.t;renderList()});
$('q').addEventListener('input',e=>{term=e.target.value;renderList()});

// ===== เฉพาะแอดมิน =====
function openProd(id){needAdmin(()=>{
  editingId=id||null;const p=id&&byId(id);
  $('pTitle').textContent=p?'แก้ไขสินค้า':'เพิ่มสินค้า';
  $('fName').value=p?p.name:'';$('fSku').value=p?p.sku||'':'';$('fSys').value=p?p.system:'';
  openM('mProd');if(!p)setTimeout(()=>$('fName').focus(),200);
})}
function saveProd(){
  const name=$('fName').value.trim(),sku=$('fSku').value.trim(),system=Math.max(0,parseInt($('fSys').value)||0);
  if(!name)return toast('⚠️ กรุณากรอกชื่อสินค้า');
  if(editingId){const p=byId(editingId);if(p){p.name=name;p.sku=sku;p.system=system}toast('✅ แก้ไขสินค้าแล้ว')}
  else{products.push({id:genId(),name,sku,system,counted:null});toast('✅ เพิ่มสินค้าแล้ว')}
  saveData();closeM('mProd');render();
}
function delOne(id){const p=byId(id);if(!p)return;ask('🗑️ ลบสินค้า',`ต้องการลบ "${p.name}" หรือไม่?`,()=>{products=products.filter(x=>x.id!==id);saveData();render();toast('🗑️ ลบสินค้าแล้ว')},'ลบเลย')}
function toggleSel(){selMode?exitSel():needAdmin(enterSel)}
function enterSel(){selMode=true;sel.clear();document.body.classList.add('sel-mode');$('selbar').classList.add('show');$('selBtn').textContent='✖ ยกเลิกเลือก';$('fab').hidden=true;renderList()}
function exitSel(){selMode=false;sel.clear();document.body.classList.remove('sel-mode');$('selbar').classList.remove('show');$('selBtn').textContent='☑️ เลือกลบ';adminUI();renderList()}
function updSel(){$('selN').textContent=sel.size;$('selDel').disabled=!sel.size}
function delSel(){const n=sel.size;if(!n)return;ask('🗑️ ลบสินค้าที่เลือก',`ต้องการลบ ${n} รายการหรือไม่? (กู้คืนไม่ได้)`,()=>{products=products.filter(p=>!sel.has(p.id));saveData();exitSel();render();toast(`🗑️ ลบ ${n} รายการแล้ว`)},'ลบเลย')}
function resetCount(){needAdmin(()=>ask('🔄 รีเซ็ตการนับ','ต้องการล้างตัวเลขที่นับได้ทั้งหมดหรือไม่?',()=>{products.forEach(p=>p.counted=null);saveData();render();toast('🔄 รีเซ็ตการนับแล้ว')},'รีเซ็ต'))}
function clearAll(){needAdmin(()=>{if(!products.length)return toast('ไม่มีข้อมูลให้ลบ');ask('🗑️ ลบทั้งหมด','ต้องการลบสินค้าทั้งหมดหรือไม่? (กู้คืนไม่ได้)',()=>{products=[];saveData();render();toast('🗑️ ลบข้อมูลทั้งหมดแล้ว')},'ลบเลย')})}

// ===== ส่งออก CSV =====
function exportCSV(){
  if(!products.length)return toast('ไม่มีข้อมูลให้ส่งออก');
  const rows=[['ชื่อสินค้า','SKU','ในระบบ','นับได้','ผลต่าง','สถานะ']];
  products.forEach(p=>{const d=diffOf(p);rows.push([p.name,p.sku||'',p.system,isCounted(p)?p.counted:'',d===null?'':d,d===null?'ยังไม่นับ':d===0?'ตรง':d<0?'ขาด '+(-d):'เกิน '+d])});
  const q=c=>typeof c==='string'&&/^[=+\-@]/.test(c)?"'"+c:c;   // กันสูตรแฝงใน Excel
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(q(c)).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`stock_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);toast('📥 ส่งออก CSV แล้ว');
}

// ===== เริ่มทำงาน =====
adminUI();render();refresh();
setInterval(refresh,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
