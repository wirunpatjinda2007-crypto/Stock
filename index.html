<!-- Dashboard layout -->
<style>
  body {
    display: flex;
    max-width: none !important;
    margin: 0;
    background: #f3f6fb;
    padding-bottom: 120px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 240px;
    background: linear-gradient(180deg, #0a2259 0%, #0b2a6b 100%);
    color: #fff;
    padding: 28px 16px 20px;
    display: flex;
    flex-direction: column;
    z-index: 40;
    overflow: hidden;
    transition: transform 0.25s ease;
  }
  .sidebar::after {
    content: "";
    position: absolute;
    left: -20%; right: -20%; bottom: -60px;
    height: 260px;
    background: radial-gradient(ellipse at 50% 100%, rgba(59,130,246,0.35), transparent 65%);
    pointer-events: none;
  }
  .side-brand {
    text-align: center;
    padding: 6px 0 28px;
    position: relative; z-index: 1;
  }
  .side-brand .logo-cube { width: 58px; height: 58px; margin: 0 auto 10px; display: block; }
  .side-brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
  .side-brand p { margin: 4px 0 0; font-size: 13px; color: #bfdbfe; }
  .side-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative; z-index: 1;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    color: #dbeafe;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
  .nav-item:hover { background: rgba(255,255,255,0.08); }
  .nav-item.active {
    background: #2563eb;
    color: #fff;
    box-shadow: 0 6px 16px rgba(37,99,235,0.35);
  }
  .side-foot {
    margin-top: auto;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(147,197,253,0.2);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    position: relative; z-index: 1;
  }
  .side-foot .online { display: flex; align-items: center; gap: 8px; color: #6ee7b7; font-weight: 500; }
  .side-foot .online .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.25);
  }
  .side-foot .user-line { margin-top: 8px; color: #dbeafe; display: flex; align-items: center; gap: 8px; }

  .side-overlay { display: none; }

  /* ---------- Main column ---------- */
  .main { margin-left: 240px; flex: 1; min-width: 0; }

  /* ---------- Pages ---------- */
  .page { display: none; }
  .page.active { display: block; }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 18px;
    padding: 14px 28px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 15;
  }
  .menu-btn {
    display: none;
    width: 38px; height: 38px;
    border: 1px solid #dbe5f3;
    background: #fff;
    border-radius: 10px;
    color: #1e3a8a;
    align-items: center; justify-content: center;
    cursor: pointer;
  }
  .topbar .admin-badge { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .topbar .admin-badge:hover { background: #dbeafe; }
  .topbar .admin-badge.unlocked { background: #059669; color: #fff; border-color: #059669; }

  .bell-wrap { position: relative; }
  .bell {
    position: relative;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    color: #1e3a8a;
    border-radius: 10px;
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .bell:hover { background: #eff6ff; }
  .bell .badge-dot {
    position: absolute;
    top: 0; right: 0;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: #dc2626;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
    box-sizing: content-box;
  }
  .notif-panel {
    position: absolute;
    right: 0;
    top: 48px;
    width: 320px;
    max-width: calc(100vw - 28px);
    max-height: 360px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(15,29,54,0.15);
    z-index: 50;
  }
  .notif-panel[hidden] { display: none; }
  .notif-head { padding: 12px 16px; font-weight: 700; color: #0f1d36; border-bottom: 1px solid #e2e8f0; }
  .notif-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid #f1f5f9;
    cursor: pointer; font-size: 13px; color: #0f1d36;
  }
  .notif-item:hover { background: #f8fafc; }
  .notif-item .sku { font-size: 11px; color: #64748b; margin-top: 2px; }
  .notif-item .tag-short { color: #dc2626; font-weight: 700; white-space: nowrap; }
  .notif-item .tag-over  { color: #ea580c; font-weight: 700; white-space: nowrap; }
  .notif-empty { padding: 20px 16px; text-align: center; color: #64748b; font-size: 13px; }

  @keyframes cardFlash {
    0%   { box-shadow: 0 0 0 4px rgba(147,197,253,0.9); }
    100% { box-shadow: none; }
  }
  .card-flash { animation: cardFlash 1.2s ease; }

  .user-chip { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #0f1d36; }
  .user-chip .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #1e3a8a;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Hero banner ---------- */
  .hero {
    position: relative;
    margin: 20px 28px 0;
    padding: 26px 30px;
    border-radius: 18px;
    background:
